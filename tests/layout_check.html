<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Floor plan layout check</title>
<link rel="stylesheet" href="../styles.css">
<style>
  /* the plan is rendered for real, just off to the side, so getBBox()
     returns the numbers the browser would actually paint */
  #stage { position: fixed; left: -3000px; top: 0; }
  #map { display: block; width: 1000px; height: 660px; }
  #RESULT { font: 12px/1.5 ui-monospace, Menlo, monospace; white-space: pre-wrap; padding: 16px; }
</style>
</head>
<body>

<div id="stage"><svg id="map" viewBox="0 0 1000 660" preserveAspectRatio="xMidYMid meet"></svg></div>
<pre id="RESULT">running...</pre>

<script src="../src/data/graph.js"></script>
<script src="../src/data/campus.js"></script>
<script src="../src/data/campus.ust.js"></script>
<script src="../src/data/active.js"></script>
<script src="../src/icons.js"></script>
<script src="../src/i18n.js"></script>
<script src="../src/router.js"></script>
<script src="../src/steps.js"></script>
<script src="../src/nlu.js"></script>
<script src="../src/data/scenarios.js"></script>
<script src="../src/map.js"></script>
<script>
(function () {
try {
  'use strict';

  var C = globalThis.FUST.Campus;
  var N = globalThis.FUST.NLU;
  var R = globalThis.FUST.Router;
  var S = globalThis.FUST.Steps;
  var svg = document.getElementById('map');

  var problems = [];
  var renders = 0;
  var checks = 0;

  function q(sel) { return Array.prototype.slice.call(svg.querySelectorAll(sel)); }

  function boxes() {
    var out = [];
    q('text').forEach(function (t) {
      var b;
      try { b = t.getBBox(); } catch (e) { return; }
      if (!b || (!b.width && !b.height)) { return; }
      out.push({
        el: t,
        role: t.getAttribute('data-role') || (t.closest('g.core') ? 'core-num' : ''),
        text: t.textContent,
        node: t.getAttribute('data-node') || '',
        x: b.x, y: b.y, w: b.width, h: b.height
      });
    });
    return out;
  }

  function rects(sel) {
    return q(sel).map(function (r) {
      return {
        x: +r.getAttribute('x'), y: +r.getAttribute('y'),
        w: +r.getAttribute('width'), h: +r.getAttribute('height')
      };
    });
  }

  function routeRects() {
    var out = [];
    q('polyline.route').forEach(function (pl) {
      var pts = (pl.getAttribute('points') || '').trim().split(/\s+/).map(function (p) {
        var xy = p.split(',');
        return { x: parseFloat(xy[0]), y: parseFloat(xy[1]) };
      });
      for (var i = 1; i < pts.length; i++) {
        var a = pts[i - 1], b = pts[i], pad = 5;
        out.push({
          x: Math.min(a.x, b.x) - pad, y: Math.min(a.y, b.y) - pad,
          w: Math.abs(a.x - b.x) + pad * 2, h: Math.abs(a.y - b.y) + pad * 2
        });
      }
    });
    return out;
  }

  function over(a, b) {
    var x = Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x);
    var y = Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y);
    return (x > 0.5 && y > 0.5) ? { w: x, h: y } : null;
  }

  function label(t) { return t.role + ' "' + t.text + '"'; }


  var drops = {};   /* width tag -> labels the renderer had to drop */

  function inspect(where) {
    renders++;
    var tag = where.indexOf('/') > 0 ? where.split('/')[0] + '/' : '';
    var st = view.stats ? view.stats() : { dropped: 0 };
    if (st.dropped) { drops[tag] = (drops[tag] || 0) + st.dropped; }
    var t = boxes();
    var lift = rects('rect.core-box');
    var route = routeRects();
    /* a POI dot is a filled marker on the plan: a label that lands on one
       loses half its characters to it, which is the kind of thing that
       only shows up in a screenshot */
    var dots = q('circle.poi-disc').map(function (c) {
      var cx = +c.getAttribute('cx'), cy = +c.getAttribute('cy'), r = +c.getAttribute('r');
      return { x: cx - r, y: cy - r, w: r * 2, h: r * 2 };
    });

    t.forEach(function (a, i) {
      checks++;
      /* 1. text on text */
      for (var j = i + 1; j < t.length; j++) {
        var b = t[j];
        if (a.role === 'core-num' || b.role === 'core-num') { continue; }
        var o = over(a, b);
        if (o) {
          problems.push(where + '  text-over-text: ' + label(a) + ' x ' + label(b) +
            '  (' + o.w.toFixed(1) + 'x' + o.h.toFixed(1) + ')');
        }
      }
      /* 2. text on a lift / stair / escalator box */
      if (a.role !== 'core-num') {
        lift.forEach(function (r) {
          var o = over(a, r);
          if (o) {
            problems.push(where + '  text-over-core: ' + label(a) +
              '  (' + o.w.toFixed(1) + 'x' + o.h.toFixed(1) + ')');
          }
        });
      }
      /* 3. label sitting on the route line */
      if (a.role !== 'core-num') {
        route.forEach(function (r) {
          var o = over(a, r);
          if (o) {
            problems.push(where + '  text-over-route: ' + label(a) +
              '  (' + o.w.toFixed(1) + 'x' + o.h.toFixed(1) + ')');
          }
        });
      }
      /* 3b. label sitting on a POI dot */
      if (a.role !== 'core-num') {
        dots.forEach(function (r) {
          var o = over(a, r);
          if (o && o.w > 0.4 && o.h > 0.4) {
            problems.push(where + '  text-over-dot: ' + label(a) +
              '  (' + o.w.toFixed(1) + 'x' + o.h.toFixed(1) + ')');
          }
        });
      }
      /* 4. off the canvas */
      if (a.x < -0.5 || a.y < -0.5 || a.x + a.w > 1000.5 || a.y + a.h > 660.5) {
        problems.push(where + '  text-off-canvas: ' + label(a) +
          '  (' + a.x.toFixed(0) + ',' + a.y.toFixed(0) + ' ' + a.w.toFixed(0) + 'x' + a.h.toFixed(0) + ')');
      }
      /* 5. room label escaped its building */
      if (a.role === 'room-label') {
        var node = C.node(a.node);
        if (node) {
          var r = C.BUILDINGS[node.b].rect;
          var slack = 3;
          if (a.x < r[0] - slack || a.y < r[1] - slack ||
              a.x + a.w > r[0] + r[2] + slack || a.y + a.h > r[1] + r[3] + slack) {
            problems.push(where + '  label-outside-building: ' + label(a) + ' (' + node.b + ')');
          }
        }
      }
    });
  }


  var view = globalThis.FUST.MapView.create(svg, { lang: 'en' });
  var LANGS = ['en', 'zh', 'yue'];

  /* Baseline: every floor with nothing routed.

     The pane width matters. Type and markers are sized in screen pixels and
     converted through `--u` (map units per CSS pixel), so the same floor is
     laid out differently in a 1000px pane and a 520px one: `u` grows as the
     pane shrinks, every label then covers *more* map units, and lanes that
     were clear at 1000px start to collide. Sweeping three widths keeps a
     phone-sized map to the same rule as a desktop one. */
  function baseline(tag) {
    LANGS.forEach(function (lang) {
      view.setLang(lang);
      C.LEVELS.forEach(function (f) {
        view.setFloor(f);
        inspect(tag + f + '/' + lang + '/no-route');
      });
    });
  }

  function sweep(width, height, tag) {
    svg.style.width = width + 'px';
    svg.style.height = height + 'px';
    baseline(tag);
  }

  /* the reference width is the one labels are expected to fit in: a label
     dropped there is a placement bug, not an honest LOD decision */
  function checkDrops() {
    if (drops['']) {
      problems.push('at 1000px ' + drops[''] + ' room labels could not be placed');
    }
  }

  sweep(1000, 660, '');
  sweep(700, 462, 'w700/');
  sweep(520, 343, 'w520/');
  checkDrops();
  svg.style.width = '1000px';
  svg.style.height = '660px';

  /* the five demo queries, in all three languages, on every floor they touch */
  globalThis.FUST.SCENARIOS.forEach(function (sc) {
    LANGS.forEach(function (lang) {
      var p = N.parse(sc.query[lang]);
      if (!p || !p.origin) {
        problems.push('scenario ' + sc.id + '/' + lang + ': did not parse');
        return;
      }
      /* POI searches answer with a nearest match instead of a destination */
      if (!p.dest) {
        if (p.poi) { return; }
        problems.push('scenario ' + sc.id + '/' + lang + ': no destination');
        return;
      }
      var plan = R.plan(p.origin.node.id, p.dest.node.id, { stepFree: p.stepFree !== false });
      if (!plan.primary) {
        problems.push('scenario ' + sc.id + '/' + lang + ': no route');
        return;
      }
      view.setLang(lang);
      view.setRoute(plan.primary, S.build(plan.primary));
      view.floors().forEach(function (f) {
        view.setFloor(f);
        inspect(f + '/' + lang + '/' + sc.id);
      });
    });
  });

  var out = [];
  if (/[?&]dump/.test(location.search)) {
    var ql = (location.search.match(/[?&]lang=(\w+)/) || [])[1] || 'en';
    var qf = (location.search.match(/[?&]floor=(\w+)/) || [])[1];
    view.setLang(ql);
    view.setRoute(null, []);
    (qf ? [qf] : ['G', 'LG1', '1F']).forEach(function (f) {
      view.setFloor(f);
      out.push('---- ' + f);
      boxes().forEach(function (t) {
        out.push('  ' + t.role + ' | ' + t.text + ' | ' + t.x.toFixed(1) + ',' + t.y.toFixed(1) +
                 ' ' + t.w.toFixed(1) + 'x' + t.h.toFixed(1));
      });
    });
    out.push('');
  }
  out.push('Freefish floor plan - label layout check');
  out.push('renders checked: ' + renders + '   texts checked: ' + checks +
           '   problems: ' + problems.length);
  out.push('pane widths: 1000px (no label may be dropped), 700px and 520px' +
           ' (labels may be dropped, none may overlap)');
  out.push('dropped labels: ' + (Object.keys(drops).length
    ? Object.keys(drops).sort().map(function (k) { return (k || 'w1000/') + drops[k]; }).join('  ')
    : 'none'));
  out.push('');
  if (!problems.length) {
    out.push('OK - no text collides with another label, a lift box, a POI dot, the');
    out.push('     route line, the canvas edge, or the building it belongs to.');
  } else {
    var seen = {};
    problems.forEach(function (p) {
      if (seen[p]) { return; }
      seen[p] = 1;
      out.push('FAIL  ' + p);
    });
  }
  document.getElementById('RESULT').textContent = out.join('\n');
} catch (e) {
  document.getElementById('RESULT').textContent = 'ERROR: ' + (e && e.message) + '\n' + (e && e.stack);
}
})();
</script>
</body>
</html>
